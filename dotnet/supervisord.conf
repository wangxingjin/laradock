; supervisord.conf
# [unix_http_server]
# file=/var/run/supervisor.sock
# chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
nodaemon=false
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; 配置 .NET 应用进程
[program:dotnet-app]
command=dotnet /app/publish/GameServer.dll
directory=/app/publish
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/supervisor/dotnet-app.err.log
stdout_logfile=/var/log/supervisor/dotnet-app.out.log
environment=ASPNETCORE_ENVIRONMENT=Production
user=root
stopsignal=INT
stopwaitsecs=10

; 可选：配置多个应用
;[program:another-app]
;command=dotnet /app/publish/AnotherApp.dll
;directory=/app/publish
;autostart=true
;autorestart=true